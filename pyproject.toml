[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-digest-backend"
version = "0.1.0"
description = "Backend for text digest application"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "mangum",
    "uvicorn",
    "pydantic",
    "boto",
    "python-dotenv",
    "boto3",
    "python-jose",
    "pypdf",
    "ocrmypdf",
    "python-multipart",
    "openai",
    "openai-agents",
    "llama_index",
    "llama-index-llms-openai",
    "llama-index-vector-stores-pinecone"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]