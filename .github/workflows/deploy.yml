name: Deploy to AWS

on:
    pull_request:
        types: [closed]
        branches: [staging, prod]

jobs:
    deploy:
        runs-on: ubuntu-latest

        env:
            PROJECT_NAME: text-digest
            ENVIRONMENT: ${{ github.ref_name }}
            IMAGE_TAG: ${{ github.sha }}

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_CICD_ARN }}
                  aws-region: us-east-1

            - name: Ensure state bucket
              run: |
                  aws s3api head-bucket --bucket text-digest-terraform-state 2>/dev/null || \
                      aws s3 mb s3://text-digest-terraform-state

            - name: Install Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Login to ECR
              uses: aws-actions/amazon-ecr-login@v2
              id: login-ecr

            - name: Terraform init
              run: terraform -chdir=terraform init -input=false -backend-config="bucket=text-digest-terraform-state" -backend-config="key=${ENVIRONMENT}/terraform.tfstate"

            - name: Select workspace
              run: |
                  terraform -chdir=terraform workspace select ${ENVIRONMENT} || \
                  terraform -chdir=terraform workspace new ${ENVIRONMENT}

            - name: Build and push image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  ECR_REPOSITORY: ${{ env.PROJECT_NAME }}-api-container-${{ env.ENVIRONMENT }}
              run: |
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            - name: Terraform apply
              run: |
                  terraform -chdir=terraform apply -input=false -auto-approve \
                    -var "project_name=${PROJECT_NAME}" \
                    -var "environment=${ENVIRONMENT}" \
                    -var "image_tag=${IMAGE_TAG}" \
                    -var "google_client_id=${{ secrets.TF_VAR_GOOGLE_CLIENT_ID }}" \
                    -var "google_client_secret=${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}" \
                    -var "modal_process=${{ secrets.TF_VAR_MODAL_PROCESS }}"
